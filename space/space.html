<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euresis Thought Space</title>
<style>
  :root {
    --bg: #05070d; --panel: rgba(12, 16, 28, .86); --line: rgba(140, 160, 210, .18);
    --text: #e6ebf5; --muted: #8b95ad; --accent: #7cc4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  .hud { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #top { top: 14px; left: 14px; padding: 12px 14px; max-width: min(560px, calc(100vw - 28px)); }
  #top h1 { margin: 0; font-size: 15px; letter-spacing: .28em; font-weight: 700; }
  #top h1 span { color: var(--accent); }
  #top .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  #stats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); font-size: 11.5px; cursor: pointer; user-select: none; white-space: nowrap; }
  .chip i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .chip.off { opacity: .35; }
  #search { margin-top: 10px; width: 100%; background: rgba(255,255,255,.04); border: 1px solid var(--line);
    color: var(--text); border-radius: 8px; padding: 7px 10px; font: inherit; outline: none; }
  #panel { top: 14px; right: 14px; width: min(380px, calc(100vw - 28px)); max-height: calc(100vh - 210px);
    overflow: auto; padding: 14px 16px; display: none; }
  #panel .kind { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  #panel h2 { font-size: 16px; margin: 4px 0 8px; line-height: 1.3; }
  #panel .formula { font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: rgba(124,196,255,.07);
    border: 1px solid rgba(124,196,255,.2); padding: 8px 10px; border-radius: 8px; word-break: break-word; }
  #panel .status { color: var(--muted); font-size: 12px; margin: 8px 0; }
  #panel h3 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  #panel a { color: var(--text); text-decoration: none; display: block; padding: 4px 0; border-bottom: 1px dashed var(--line); cursor: pointer; }
  #panel a:hover { color: var(--accent); }
  #mini { inset: auto; right: 14px; bottom: 14px; width: 190px; height: 190px; padding: 0; overflow: hidden; }
  #bench { left: 14px; bottom: 14px; padding: 10px 12px; max-width: min(420px, calc(100vw - 230px)); font-size: 12px; display: none; }
  #bench b { color: var(--accent); }
  #bench .row { display: flex; gap: 6px; color: var(--muted); }
  #bench .row.ok { color: var(--text); }
  #help { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 11px; pointer-events: none; }
  @media (max-width: 640px) { #mini { display: none; } #bench { max-width: calc(100vw - 28px); } #help { display: none; } }
</style>
</head>
<body>

</div>

<div id="bench" class="hud"></div>
<canvas id="mini" class="hud"></canvas>

      b.laws.map(l => `<div class="row ${l.found ? "ok" : ""}">${l.found ? "✔" : "✘"} ${l.law}${l.found ? ` <span style="color:#8b95ad">· ${l.method}${l.exact ? "" : " · ×" + l.factor}</span>` : ""}</div>`).join("");
  }
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function select(id, fly = true) {
  sel = id ? byId.get(id) : null; relSet = sel ? related(sel.id) : null;
  const p = document.getElementById("panel");
  if (!sel) { p.style.display = "none"; draw(); return; }
  const link = i => { const n = byId.get(i); return n ? `<a data-id="${n.id}"><span style="color:${COLORS[n.k]}">●</span> ${esc(n.ti)}</a>` : ""; };
  p.innerHTML = `<div class="kind" style="color:${COLORS[sel.k]}">${esc(DATA.kinds[sel.k] || sel.k)}${sel.c ? " · cycle " + sel.c : ""}</div>
    <h2>${esc(sel.ti)}</h2>${sel.f && sel.f !== sel.ti ? `<div class="formula">${esc(sel.f)}</div>` : ""}
    ${sel.s ? `<div class="status">${esc(sel.s)}</div>` : ""}<div>${esc(sel.b || "")}</div>
    ${sel.p.length ? `<h3>Built from</h3>${sel.p.map(link).join("")}` : ""}
    ${(children.get(sel.id) || []).length ? `<h3>Led to</h3>${children.get(sel.id).slice(0, 40).map(link).join("")}` : ""}`;
  p.style.display = "block";
  p.querySelectorAll("a").forEach(a => a.onclick = () => select(a.dataset.id));
  if (fly) flyTo(sel.x, sel.y, Math.max(cam.z, .9)); else draw();
}
let anim = null;
function flyTo(x, y, z, ms = 600) {
  const s = { ...cam }, t0 = performance.now(); cancelAnimationFrame(anim);
  const step = t => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    cam.x = s.x + (x - s.x) * e; cam.y = s.y + (y - s.y) * e; cam.z = Math.exp(Math.log(s.z) + (Math.log(z) - Math.log(s.z)) * e);
    draw(); if (k < 1) anim = requestAnimationFrame(step); };
  if (ms === 0) { cam.x = x; cam.y = y; cam.z = z; draw(); } else anim = requestAnimationFrame(step);
}
function pick(X, Y) {
  let best = null, bd = 18 * 18;
  for (const n of nodes) { if (!visible(n)) continue; const dx = sx(n.x) - X, dy = sy(n.y) - Y, d = dx * dx + dy * dy; if (d < bd) { bd = d; best = n; } }
  return best;
}
let drag = null, moved = false;
cv.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; moved = false; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > 3) moved = true; cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z; draw(); }
  else { const h = pick(e.clientX, e.clientY); if (h !== hover) { hover = h; draw(); } }
});
cv.addEventListener("pointerup", e => { cv.classList.remove("drag"); if (!moved) { const n = pick(e.clientX, e.clientY); select(n ? n.id : null, false); } drag = null; });
cv.addEventListener("wheel", e => { e.preventDefault(); const f = Math.exp(-e.deltaY * .0015), X = wx(e.clientX), Y = wy(e.clientY);
  cam.z = Math.min(8, Math.max(.01, cam.z * f)); cam.x = X - (e.clientX - W / 2) / cam.z; cam.y = Y - (e.clientY - H / 2) / cam.z; draw(); }, { passive: false });
mini.addEventListener("click", e => { const r = mini.getBoundingClientRect(), t = mini._t; flyTo((e.clientX - r.left - t.ox) / t.s, (e.clientY - r.top - t.oy) / t.s, cam.z); });
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return; const q = e.target.value.toLowerCase().trim(); if (!q) return;
  const hits = nodes.filter(n => (n.ti + " " + n.f + " " + n.b).toLowerCase().includes(q));
  hits.sort((a, b) => (RADIUS[b.k] || 0) - (RADIUS[a.k] || 0)); if (hits[0]) select(hits[0].id);
});
addEventListener("resize", resize);
window.EURESIS = { cam, flyTo, select, nodes, find: q => nodes.filter(n => (n.ti + " " + n.f).toLowerCase().includes(q.toLowerCase())),
  hideHud: () => document.querySelectorAll(".hud,#help").forEach(e => e.style.display = "none") };
buildHud();
const hp = new URLSearchParams(location.hash.slice(1));
if (hp.has("z")) { cam.x = +hp.get("x") || 0; cam.y = +hp.get("y") || 0; cam.z = +hp.get("z"); }
else { cam.z = Math.min(innerWidth / (bounds.x1 - bounds.x0 + 1200), innerHeight / (bounds.y1 - bounds.y0 + 1200)); cam.x = (bounds.x0 + bounds.x1) / 2; cam.y = (bounds.y0 + bounds.y1) / 2; }
resize();
if (hp.has("sel")) select(hp.get("sel"), false);
</script>
