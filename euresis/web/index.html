<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Euresis</title>
<link rel="icon" type="image/png" href="/favicon.png">
<style>
:root {
  --bg: #ffffff; --side: #f6f6fb; --panel: #ffffff; --text: #14152b; --muted: #6b6d85; --faint: #9a9cb3;
  --border: #e4e4ee; --hover: #ececf6; --accent: #4a47e6; --accent-2: #7d6cf2; --accent-ink: #ffffff;
  --user: #eeeefd; --code: #f4f4fa; --shadow: 0 6px 24px rgba(20, 21, 43, .08);
  --ok: #17845a; --ok-bg: #e5f5ee; --warn: #9a6400; --warn-bg: #fbf1dc; --info: #2f5fd0; --info-bg: #e7eefc;
  --bad: #c03636; --bad-bg: #fbe8e8; --none: #6b6d85; --none-bg: #efeff4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161f; --side: #0f1017; --panel: #1c1d29; --text: #ececf5; --muted: #a0a2b8; --faint: #6e7088;
    --border: #2a2b3a; --hover: #222333; --accent: #8b84ff; --accent-2: #a99dff; --accent-ink: #0f1017;
    --user: #262640; --code: #1f2030; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    --ok: #4fd39a; --ok-bg: #12301f; --warn: #f0be5c; --warn-bg: #33270f; --info: #8fb0ff; --info-bg: #17233f;
    --bad: #ff8a8a; --bad-bg: #3a1717; --none: #a0a2b8; --none-bg: #262735;
  }
}
:root[data-theme="dark"] {
  --bg: #15161f; --side: #0f1017; --panel: #1c1d29; --text: #ececf5; --muted: #a0a2b8; --faint: #6e7088;
  --border: #2a2b3a; --hover: #222333; --accent: #8b84ff; --accent-2: #a99dff; --accent-ink: #0f1017;
  --user: #262640; --code: #1f2030; --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  --ok: #4fd39a; --ok-bg: #12301f; --warn: #f0be5c; --warn-bg: #33270f; --info: #8fb0ff; --info-bg: #17233f;
  --bad: #ff8a8a; --bad-bg: #3a1717; --none: #a0a2b8; --none-bg: #262735;
}
.only-dark { display: none; }
:root[data-theme="dark"] .only-dark { display: inline-block; }
:root[data-theme="dark"] .only-light { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .only-dark { display: inline-block; }
  :root:not([data-theme="light"]) .only-light { display: none; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: flex; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: var(--accent); }

/* ---------- sidebar ---------- */
#side { width: 272px; flex: none; background: var(--side); border-right: 1px solid var(--border); display: flex; flex-direction: column;
  height: 100%; transition: transform .2s ease; z-index: 20; }
.brand { padding: 14px 16px 6px; display: flex; align-items: center; justify-content: space-between; }
.brand img { height: 40px; width: auto; }
.icon-btn { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.newchat { margin: 8px 12px 6px; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--panel); font-weight: 550; }
.newchat:hover { border-color: var(--accent); }
.side-scroll { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
.side-h { font-size: 12px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding: 14px 8px 6px; }
.chat-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 7px 8px; border-radius: 8px;
  color: var(--text); font-size: 14px; }
.chat-item span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-item:hover, .chat-item.on { background: var(--hover); }
.chat-item .del { opacity: 0; color: var(--faint); padding: 0 4px; }
.chat-item:hover .del { opacity: 1; }
.disc { display: block; width: 100%; text-align: left; padding: 8px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
.disc:hover { background: var(--hover); }
.disc .cat { font-size: 11px; color: var(--faint); display: flex; gap: 6px; align-items: center; margin-bottom: 2px; }
.disc .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
.side-foot { border-top: 1px solid var(--border); padding: 10px 14px; font-size: 12px; color: var(--muted); display: flex;
  align-items: center; gap: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.live { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.side-foot .grow { flex: 1; min-width: 0; }
.side-foot .grow div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- main ---------- */
#main { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; position: relative; }
.topbar { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; }
.topbar .title { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
#menu { display: none; }
#scroll { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
.col { max-width: 780px; margin: 0 auto; padding: 0 20px; }
#msgs { padding: 8px 0 24px; }

.empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 9vh 0 20px; }
.empty img { width: min(380px, 80vw); height: auto; }
.empty h1 { font-size: 26px; font-weight: 600; margin: 22px 0 6px; letter-spacing: -.01em; }
.empty p { color: var(--muted); margin: 0 0 26px; max-width: 520px; }
.sugg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.sugg button { text-align: left; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: var(--panel);
  font-size: 14px; line-height: 1.4; }
.sugg button:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.sugg small { display: block; color: var(--faint); font-size: 12px; margin-top: 4px; }

.msg { display: flex; gap: 14px; margin: 22px 0; }
.msg.user { justify-content: flex-end; }
.msg.user .bubble { background: var(--user); padding: 10px 16px; border-radius: 18px 18px 4px 18px; max-width: 85%;
  white-space: pre-wrap; word-wrap: break-word; }
.avatar { width: 32px; height: 32px; flex: none; border-radius: 50%; border: 1px solid var(--border); background: var(--panel);
  display: grid; place-items: center; overflow: hidden; margin-top: 2px; }
.avatar img { width: 30px; height: 30px; }
.msg.bot .body { flex: 1; min-width: 0; }
.meta { font-size: 12px; color: var(--faint); margin-top: 6px; display: flex; gap: 12px; align-items: center; }
.meta button { color: var(--faint); font-size: 12px; }
.meta button:hover { color: var(--text); }

.md { word-wrap: break-word; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 12px; }
.md h1, .md h2, .md h3, .md h4 { margin: 18px 0 8px; line-height: 1.3; }
.md h1 { font-size: 21px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; } .md h4 { font-size: 15px; }
.md ul, .md ol { padding-left: 22px; }
.md li { margin: 3px 0; }
.md code { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--code); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 14px; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.md th { background: var(--code); }
.md blockquote { border-left: 3px solid var(--accent-2); padding: 2px 12px; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 16px 0; }
.cid { font: 12px ui-monospace, Menlo, monospace; background: var(--code); border: 1px solid var(--border); border-radius: 6px;
  padding: 0 5px; cursor: pointer; color: var(--accent); }
.cursor::after { content: ""; display: inline-block; width: 8px; height: 15px; background: var(--accent); border-radius: 2px;
  margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.work { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; background: var(--panel); }
.work summary { list-style: none; cursor: pointer; padding: 9px 12px; font-size: 13px; color: var(--muted); display: flex;
  align-items: center; gap: 8px; }
.work summary::-webkit-details-marker { display: none; }
.work summary .chev { transition: transform .15s; }
.work[open] summary .chev { transform: rotate(90deg); }
.work .log { border-top: 1px solid var(--border); padding: 8px 12px; max-height: 260px; overflow-y: auto;
  font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); white-space: pre-wrap; word-break: break-word; }
.spin { width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
  animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.claims { display: grid; gap: 8px; margin-bottom: 14px; }
.claims-h { font-size: 12px; color: var(--faint); margin: 0 0 -2px; }
.card { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; background: var(--panel); font-size: 14px; line-height: 1.45; }
.card .top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.badge { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.b-proved { color: var(--ok); background: var(--ok-bg); }
.b-numeric { color: var(--warn); background: var(--warn-bg); }
.b-empirical { color: var(--info); background: var(--info-bg); }
.b-refuted { color: var(--bad); background: var(--bad-bg); }
.b-none { color: var(--none); background: var(--none-bg); }
.card .lbl { font-size: 12px; color: var(--muted); }
.card .kind { font-size: 11.5px; color: var(--faint); margin-left: auto; font-family: ui-monospace, Menlo, monospace; }
.card .st { word-break: break-word; }
.err { color: var(--bad); background: var(--bad-bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; }

/* ---------- composer ---------- */
.composer-wrap { flex: none; padding: 0 0 14px; background: linear-gradient(to bottom, transparent, var(--bg) 30%); }
.composer { border: 1px solid var(--border); border-radius: 22px; background: var(--panel); box-shadow: var(--shadow); padding: 10px 10px 8px 16px; }
.composer:focus-within { border-color: var(--accent); }
#input { width: 100%; resize: none; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit;
  max-height: 220px; min-height: 26px; padding: 4px 0; }
#input::placeholder { color: var(--faint); }
.row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.modes { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.modes button { padding: 4px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.modes button.on { background: var(--accent); color: var(--accent-ink); }
.row .hint { font-size: 12px; color: var(--faint); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
#send:disabled { opacity: .35; cursor: default; }
.foot-note { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 8px; }

#scrim { display: none; }
@media (max-width: 820px) {
  #side { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); box-shadow: var(--shadow); }
  body.side-open #side { transform: none; }
  body.side-open #scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 15; }
  #menu { display: grid; }
  .col { padding: 0 16px; }
  .sugg { grid-template-columns: 1fr; }
  .empty { padding-top: 4vh; }
  .row .hint { display: none; }
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand">
    <img class="only-light" src="/logo.png" alt="Euresis">
    <img class="only-dark" src="/logo-dark.png" alt="Euresis">
    <button class="icon-btn" id="theme" title="Switch light / dark">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
  <button class="newchat" id="new">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>
  <div class="side-scroll">
    <div class="side-h">Chats</div>
    <div id="chats"></div>
    <div class="side-h">Latest verified results</div>
    <div id="discs"><div class="disc"><span class="txt">loading…</span></div></div>
  </div>
  <div class="side-foot">
    <span class="dot" id="dot"></span>
    <div class="grow"><div id="st1">connecting…</div><div id="st2"></div></div>
  </div>
</aside>
<div id="scrim"></div>

<main id="main">
  <div class="topbar">
    <button class="icon-btn" id="menu" title="Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div class="title" id="title"></div>
  </div>
  <div id="scroll"><div class="col" id="msgs"></div></div>
  <div class="composer-wrap">
    <div class="col">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask Euresis anything, or ask it to discover and prove something…"></textarea>
        <div class="row">
          <div class="modes" role="tablist">
            <button data-mode="ask" class="on" title="Quick answer grounded in Euresis' verified results">Ask</button>
            <button data-mode="research" title="Full reasoning loop: claims are checked by the verification gate (takes minutes)">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/></svg>
              Research</button>
          </div>
          <div class="hint" id="hint">Quick answer from Euresis' knowledge and verified results</div>
          <button id="send" title="Send" disabled>
            <svg id="sendIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div class="foot-note">Only Euresis' verification gate marks a claim as proved. Empirical findings are evidence, not proof; “novelty unchecked” means not yet compared with published work.</div>
    </div>
  </div>
</main>

<script>
(() => {
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: chats last for this tab */ } },
};

/* ---------- theme ---------- */
const root = document.documentElement;
const savedTheme = store.get("euresis.theme", null);
if (savedTheme) root.dataset.theme = savedTheme;
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  store.set("euresis.theme", root.dataset.theme);
};

/* ---------- markdown (safe: everything is escaped first) ---------- */
function inline(s) {
  s = esc(s);
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_, c) => (codes.push(c), `\u0000${codes.length - 1}\u0000`));
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
       .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<em>$2</em>")
       .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
       .replace(/\[?\b([a-z]{3}-[0-9a-f]{12})\b\]?/g, '<span class="cid" data-id="$1">$1</span>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`);
}
function md(src) {
  const lines = String(src).replace(/\r/g, "").split("\n");
  let out = "", i = 0;
  const para = [];
  const flush = () => { if (para.length) { out += `<p>${inline(para.join("\n")).replace(/\n/g, "<br>")}</p>`; para.length = 0; } };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if ((m = l.match(/^\s*```(\w*)/))) {
      flush(); const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++; out += `<pre><code>${esc(buf.join("\n"))}</code></pre>`; continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { flush(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { flush(); out += "<hr>"; i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i + 1])) {
      flush();
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      out += "<table><thead><tr>" + cells(l).map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>";
      i += 2;
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) out += "<tr>" + cells(lines[i++]).map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      out += "</tbody></table>"; continue;
    }
    if (/^\s*>/.test(l)) {
      flush(); const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out += `<blockquote>${md(buf.join("\n"))}</blockquote>`; continue;
    }
    if ((m = l.match(/^\s*([-*+]|\d+[.)])\s+/))) {
      flush(); const ordered = /\d/.test(m[1]); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        let item = lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/, "");
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) item += " " + lines[i++].trim();
        items.push(`<li>${inline(item)}</li>`);
      }
      out += ordered ? `<ol>${items.join("")}</ol>` : `<ul>${items.join("")}</ul>`; continue;
    }
    if (!l.trim()) { flush(); i++; continue; }
    para.push(l); i++;
  }
  flush();
  return out;
}

/* ---------- claim cards ---------- */
function badgeOf(c) {
  if (c.status === "proved") return ["b-proved", "Proved"];
  if (c.status === "verified-numeric") return c.kind === "empirical" ? ["b-empirical", "Confirmed on held-out data"] : ["b-numeric", "Numerically verified"];
  if (c.status === "refuted") return ["b-refuted", "Refuted"];
  return ["b-none", c.status === "candidate" ? "Not yet checked" : "Not verified"];
}
function card(c) {
  const [cls, name] = badgeOf(c);
  const novelty = c.status === "proved" ? (c.label.replace(/^proved;\s*/, "")) : c.label;
  return `<div class="card"><div class="top"><span class="badge ${cls}">${esc(name)}</span>` +
    `<span class="lbl">${esc(novelty)}</span><span class="kind">${esc(c.kind)} · ${esc(c.id)}</span></div>` +
    `<div class="st">${esc(c.statement)}</div></div>`;
}

/* ---------- chats ---------- */
let chats = store.get("euresis.chats", []);
let current = null, mode = "ask", busy = null;
const save = () => store.set("euresis.chats", chats.slice(0, 60));
const uid = () => Math.random().toString(36).slice(2, 10);

function renderChats() {
  $("#chats").innerHTML = chats.length ? chats.map(c =>
    `<button class="chat-item${current && c.id === current.id ? " on" : ""}" data-id="${c.id}"><span>${esc(c.title)}</span>` +
    `<span class="del" data-del="${c.id}" title="Delete">✕</span></button>`).join("")
    : `<div class="disc"><span class="txt">No chats yet.</span></div>`;
}
$("#chats").onclick = e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    chats = chats.filter(c => c.id !== del.dataset.del); save();
    if (current && current.id === del.dataset.del) newChat(); else renderChats();
    return;
  }
  const b = e.target.closest("[data-id]");
  if (b) { open(chats.find(c => c.id === b.dataset.id)); closeSide(); }
};

const SUGG = [
  ["Which octal games has Euresis completely solved, and which has the longest period?", "ask"],
  ["What did Euresis find about deep scales across 5- to 18-tone tunings?", "ask"],
  ["Is relativistic kinetic energy always at least the classical kinetic energy? Prove it.", "research"],
  ["Find and prove a new inequality for a damped harmonic oscillator.", "research"],
];
function renderEmpty() {
  $("#msgs").innerHTML = `<div class="empty">
    <img class="only-light" src="/logo.png" alt="Euresis"><img class="only-dark" src="/logo-dark.png" alt="Euresis">
    <h1>What should we discover?</h1>
    <p>Ask about anything Euresis has proved, or switch to Research to have it propose new claims and check them with its verification gate.</p>
    <div class="sugg">${SUGG.map(([q, m], i) => `<button data-s="${i}">${esc(q)}<small>${m === "research" ? "Research · proves claims" : "Ask · quick answer"}</small></button>`).join("")}</div></div>`;
}
$("#msgs").addEventListener("click", e => {
  const s = e.target.closest("[data-s]");
  if (s) { const [q, m] = SUGG[+s.dataset.s]; setMode(m); $("#input").value = q; grow(); send(); return; }
  const cid = e.target.closest(".cid");
  if (cid) showClaim(cid.dataset.id);
  const retry = e.target.closest("[data-copy]");
  if (retry) { try { navigator.clipboard.writeText(retry.closest(".body").querySelector(".md").innerText); retry.textContent = "Copied"; } catch (err) {} }
});

function newChat() {
  if (busy) busy.abort();
  current = null; $("#title").textContent = ""; renderEmpty(); renderChats(); $("#input").focus();
}
function open(c) {
  if (busy) busy.abort();
  current = c; $("#title").textContent = c.title;
  $("#msgs").innerHTML = ""; c.messages.forEach(m => $("#msgs").appendChild(view(m)));
  renderChats(); scrollDown(true);
}
$("#new").onclick = () => { newChat(); closeSide(); };

function view(m) {
  const el = document.createElement("div");
  if (m.role === "user") {
    el.className = "msg user"; el.innerHTML = `<div class="bubble">${esc(m.content)}</div>`; return el;
  }
  el.className = "msg bot";
  el.innerHTML = `<div class="avatar"><img class="only-light" src="/mark.png" alt=""><img class="only-dark" src="/mark-dark.png" alt=""></div>
    <div class="body"><div class="slot-work"></div><div class="slot-claims"></div><div class="md"></div><div class="meta"></div></div>`;
  paint(el, m, false);
  return el;
}
function paint(el, m, live) {
  const w = $(".slot-work", el);
  if (m.steps && m.steps.length) {
    const openNow = live || (w.firstChild && w.firstChild.open);
    const head = live ? `<span class="spin"></span>${m.mode === "research" ? "Researching" : "Working"} · ${m.steps.length} step${m.steps.length > 1 ? "s" : ""}`
      : `<span class="chev">›</span>${m.mode === "research" ? "Research log" : "Steps"} · ${m.steps.length} step${m.steps.length > 1 ? "s" : ""}`;
    w.innerHTML = `<details class="work"${openNow ? " open" : ""}><summary>${head}</summary><div class="log">${esc(m.steps.join("\n"))}</div></details>`;
    const log = $(".log", w); log.scrollTop = log.scrollHeight;
  } else if (live && !m.content) {
    w.innerHTML = `<details class="work"><summary><span class="spin"></span>Thinking…</summary></details>`;
  } else w.innerHTML = "";
  const cl = $(".slot-claims", el);
  const claims = m.claims || [];
  if (claims.length) {
    const research = claims.filter(c => c.source === "research"), ctx = claims.filter(c => c.source !== "research");
    cl.innerHTML = (research.length ? `<div class="claims"><div class="claims-h">Decided by the verification gate in this run</div>${research.map(c => card(c.claim)).join("")}</div>` : "") +
      (ctx.length ? `<details class="work"><summary><span class="chev">›</span>${ctx.length} related verified result${ctx.length > 1 ? "s" : ""} from Euresis' registry</summary><div style="padding:10px" class="claims">${ctx.map(c => card(c.claim)).join("")}</div></details>` : "");
  } else cl.innerHTML = "";
  const body = $(".md", el);
  body.innerHTML = md(m.content || "") + (m.error ? `<div class="err">${esc(m.error)}</div>` : "");
  body.classList.toggle("cursor", !!live && !!m.content);
  const meta = $(".meta", el);
  meta.innerHTML = live ? "" : [m.backend ? esc(m.backend) : "", m.seconds != null ? `${fmtTime(m.seconds)}` : "",
    m.content ? `<button data-copy>Copy</button>` : ""].filter(Boolean).join(" · ");
}
const fmtTime = s => s < 60 ? `${s.toFixed(1)} s` : `${Math.floor(s / 60)} min ${Math.round(s % 60)} s`;

/* ---------- sending ---------- */
const input = $("#input"), sendBtn = $("#send");
const SEND_ICON = $("#sendIcon").outerHTML;
const STOP_ICON = '<svg width="14" height="14" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></svg>';
function grow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 220) + "px"; sendBtn.disabled = !busy && !input.value.trim(); }
input.addEventListener("input", grow);
input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!busy) send(); } });
sendBtn.onclick = () => busy ? busy.abort() : send();
function setMode(m) {
  mode = m;
  document.querySelectorAll(".modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("#hint").textContent = m === "research" ? "Proposes claims and checks each one with the verification gate · takes minutes"
    : "Quick answer from Euresis' knowledge and verified results";
}
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

function scrollDown(force) {
  const s = $("#scroll");
  if (force || s.scrollHeight - s.scrollTop - s.clientHeight < 160) s.scrollTop = s.scrollHeight;
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  if (!current) {
    current = { id: uid(), title: text.slice(0, 60), messages: [], updated: Date.now() };
    chats.unshift(current); $("#msgs").innerHTML = ""; $("#title").textContent = current.title;
  }
  input.value = ""; grow();
  const um = { role: "user", content: text };
  current.messages.push(um); $("#msgs").appendChild(view(um));
  const bm = { role: "assistant", content: "", steps: [], claims: [], mode };
  current.messages.push(bm);
  const el = view(bm); $("#msgs").appendChild(el); paint(el, bm, true);
  current.updated = Date.now(); chats = [current, ...chats.filter(c => c.id !== current.id)]; save(); renderChats(); scrollDown(true);

  const ctrl = new AbortController(); busy = ctrl;
  sendBtn.innerHTML = STOP_ICON; sendBtn.disabled = false; sendBtn.title = "Stop";
  const t0 = performance.now();
  let pending = false;
  const repaint = () => { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; paint(el, bm, busy === ctrl); scrollDown(); }); } };
  try {
    const history = current.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history, mode }), signal: ctrl.signal });
    if (!r.ok || !r.body) throw new Error(`server answered ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let k;
      while ((k = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, k); buf = buf.slice(k + 2);
        if (!chunk.startsWith("data: ")) continue;
        const ev = JSON.parse(chunk.slice(6));
        if (ev.type === "token") bm.content += ev.text;
        else if (ev.type === "step") bm.steps.push(ev.text);
        else if (ev.type === "claim") {
          const i = bm.claims.findIndex(c => c.claim.id === ev.claim.id);
          if (i >= 0) bm.claims[i] = ev; else bm.claims.push(ev);
        } else if (ev.type === "backend") bm.backend = ev.name;
        else if (ev.type === "error") bm.error = ev.text;
        else if (ev.type === "done") bm.seconds = ev.seconds;
        repaint();
      }
    }
  } catch (e) {
    if (e.name === "AbortError") bm.error = bm.content ? null : "Stopped.";
    else bm.error = "Could not reach Euresis: " + e.message;
  }
  if (bm.seconds == null) bm.seconds = (performance.now() - t0) / 1000;
  busy = null; sendBtn.innerHTML = SEND_ICON; sendBtn.title = "Send"; grow();
  paint(el, bm, false); save(); scrollDown();
  refreshSide();
}

/* ---------- claim popup (as a chat message) ---------- */
async function showClaim(id) {
  try {
    const c = await (await fetch(`/api/claim/${id}`)).json();
    if (c.error) return;
    const el = document.createElement("div");
    el.className = "msg bot";
    el.innerHTML = `<div class="avatar"><img class="only-light" src="/mark.png" alt=""><img class="only-dark" src="/mark-dark.png" alt=""></div><div class="body">${card(c)}
      <div class="meta">verifier: ${esc(c.verifier || "—")}${c.novelty ? " · novelty: " + esc(c.novelty) : ""}</div></div>`;
    $("#msgs").appendChild(el); scrollDown(true);
  } catch (e) {}
}

/* ---------- sidebar data ---------- */
async function refreshSide() {
  try {
    const s = await (await fetch("/api/status")).json();
    const proved = (s.claims && s.claims.proved) || 0;
    $("#dot").classList.toggle("live", !!s.daemon);
    $("#st1").textContent = `Model: ${s.backend}`;
    $("#st2").textContent = `${proved.toLocaleString()} proved · discovery ${s.daemon ? "running" : "stopped"}`;
  } catch (e) { $("#st1").textContent = "server not reachable"; $("#st2").textContent = ""; }
  try {
    const d = await (await fetch("/api/discoveries")).json();
    $("#discs").innerHTML = d.slice(0, 14).map((x, i) => {
      const [cls, name] = badgeOf(x);
      return `<button class="disc" data-d="${i}"><div class="cat"><span class="badge ${cls}">${esc(name)}</span>${esc(x.category)}</div><div class="txt">${esc(x.statement)}</div></button>`;
    }).join("") || `<div class="disc"><span class="txt">None yet.</span></div>`;
    $("#discs").onclick = e => {
      const b = e.target.closest("[data-d]"); if (!b) return;
      const x = d[+b.dataset.d];
      newChat(); setMode("ask");
      input.value = `Explain this result [${x.id}] in plain language: what was shown, how it was verified, and whether it is new: ${x.statement}`;
      grow(); send(); closeSide();
    };
  } catch (e) {}
}

/* ---------- mobile sidebar ---------- */
const closeSide = () => document.body.classList.remove("side-open");
$("#menu").onclick = () => document.body.classList.add("side-open");
$("#scrim").onclick = closeSide;

renderEmpty(); renderChats(); refreshSide(); setInterval(refreshSide, 60000); input.focus();
})();
</script>
</body>
</html>
